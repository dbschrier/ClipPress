name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-vite build

      - name: Package
        run: npx electron-builder --publish never

      - name: Validate OTA artifacts
        run: node scripts/validate-release.mjs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ClipPress ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          body: |
            ## Install

            Download and run **ClipPress Setup.exe** below.

            Windows will show a security warning the first time — click **More info → Run anyway**.

            ---

            Already installed? You'll get this update automatically next time you open the app.

            > `latest.yml` and `.exe.blockmap` are used for automatic updates — you don't need to download them.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
